<!doctype html>
<html lang="es" data-pal="diario">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Voces de Tocopilla</title>
<meta name="description" content="Revista virtual de los cuartos medios del Liceo Politécnico Diego Portales de Tocopilla.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&family=Special+Elite&family=UnifrakturCook:wght@700&display=swap">
<style>
/* Diario obrero del salitre: páginas de prensa sobre una mesa, una sola tinta roja, fotos en blanco y negro, columnas en modo leer */
:root{
  --k:1;
  --bg:#CDC4AB; --paper:#E8E0CA; --ink:#1C1A16; --muted:#5C5545; --faint:#B2A88B; --red:#B3201D;
  --bar:#1C1A16; --bar-ink:#E8E0CA; --ok:#2F6B3A; --warn:#8A5A00; --bad:#B3201D;
  --f-black:'UnifrakturCook','Old English Text MT',Georgia,serif;
  --f-head:'Old Standard TT',Georgia,'Times New Roman',serif;
  --f-sc:'IM Fell English SC',Georgia,serif;
  --f-type:'Special Elite','Courier New',monospace;
  --noise:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .28  0 0 0 0 .22  0 0 0 0 .12  0 0 0 .11 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  color-scheme:light;
}
html[data-pal="blanco"]{ --bg:#D5D5D1; --paper:#F7F5EF; --faint:#C9C5B8; --muted:#57534A; }
html[data-pal="noche"]{ --bg:#0E0D0A; --paper:#211E18; --ink:#E9E0C8; --muted:#A79E85; --faint:#4B4536; --red:#E5605A;
  --bar:#E9E0C8; --bar-ink:#1C1A16; --ok:#7CCB8A; --warn:#E7B04A; --bad:#FF8A80; color-scheme:dark; }
*{box-sizing:border-box}
html{font-size:calc(17px * var(--k));-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-head);font-size:1rem;line-height:1.6;
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));padding-block:0 4rem}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:760px;margin:0 auto}

/* barra de la imprenta */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bar);color:var(--bar-ink);padding:.55rem .8rem .6rem;
  display:grid;grid-template-columns:minmax(0,1fr);gap:.5rem;border-bottom:3px double var(--bar-ink);box-shadow:0 3px 0 rgba(0,0,0,.25);font-family:var(--f-type);font-size:.8rem}
.bar>*{min-width:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar)}
.bar-top{display:flex;flex-wrap:wrap;gap:.4rem .9rem;align-items:center;justify-content:space-between}
.mast{display:flex;align-items:baseline;gap:.7rem;flex-wrap:wrap}
.mast b{font-family:var(--f-black);font-weight:700;font-size:1.55rem;line-height:1}
.status{display:flex;align-items:center;gap:.4rem;opacity:.85}
.status i{width:.55rem;height:.55rem;background:var(--ok);display:inline-block}
.status[data-s="saving"] i{background:var(--warn)} .status[data-s="error"] i{background:var(--bad)}
.tools{display:flex;gap:.35rem;flex-wrap:wrap;align-items:center}
.btn{background:transparent;border:1px solid var(--bar-ink);padding:.25rem .6rem;font-family:var(--f-type);font-size:.8rem;color:var(--bar-ink);line-height:1.2}
.btn[aria-pressed="true"]{background:var(--bar-ink);color:var(--bar)}
.btn:disabled{opacity:.35;cursor:default}
.btn:focus-visible,select:focus-visible,.toc button:focus-visible,.chip:focus-visible,.clave input:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.chips{display:flex;gap:.3rem;overflow-x:auto;padding-bottom:.15rem;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;min-width:2rem;height:1.8rem;border:1px solid var(--bar-ink);background:transparent;color:var(--bar-ink);font-family:var(--f-type);font-size:.85rem;padding:0 .4rem;position:relative}
.chip.has::after{content:"";position:absolute;left:.3rem;right:.3rem;bottom:.18rem;height:2px;background:var(--bar-ink)}
.sub-bar{display:flex;flex-wrap:wrap;gap:.2rem 1rem;justify-content:space-between;opacity:.85}
.clave{display:flex;gap:.3rem}
.clave input{background:transparent;border:1px solid var(--bar-ink);color:var(--bar-ink);padding:.25rem .5rem;font-family:var(--f-type);font-size:.8rem;width:9.5rem;border-radius:0}
.clave input::placeholder{color:var(--bar-ink);opacity:.6}
.note{margin:1.1rem 0 0;padding:.7rem .9rem;border:1px dashed var(--ink);background:var(--paper);font-family:var(--f-type);font-size:.85rem}

/* hojas */
.pages{display:grid;grid-template-columns:minmax(0,1fr);gap:2rem;margin-top:1.4rem}
.pages>*{min-width:0}
.sheet{background-color:var(--paper);background-image:var(--noise);box-shadow:3px 3px 0 rgba(0,0,0,.25),0 0 0 1px var(--faint);width:100%;aspect-ratio:210/297;
  padding:1.3rem 2.1rem 3.4rem;position:relative;display:flex;flex-direction:column;gap:.9rem;scroll-margin-top:9rem}
.rh{display:grid;grid-template-columns:1fr auto 1fr;gap:.6rem;align-items:baseline;border-bottom:3px double var(--ink);padding-bottom:.3rem;font-family:var(--f-sc);font-size:.9rem}
.rh .brand{font-family:var(--f-black);font-size:1.4rem;line-height:1}
.rh .sec{text-align:center;color:var(--red)}
.rh .pg{text-align:right;font-family:var(--f-type);font-size:.8rem}
.folio{position:absolute;bottom:1rem;left:0;right:0;text-align:center;font-family:var(--f-type);font-size:.85rem;color:var(--muted)}
.kick{font-family:var(--f-sc);font-size:1rem;letter-spacing:.05em;color:var(--red);border-bottom:1px solid var(--ink);padding-bottom:.15rem}
.body{display:flex;flex-direction:column;gap:.9rem;flex:1}

/* campos */
.fld{display:grid;gap:.15rem}
.fld>label{font-family:var(--f-type);font-size:.74rem;color:var(--muted)}
.fld>label::before{content:"› "}
.read .fld>label{display:none}
.fld.sub>label{display:block;font-family:var(--f-sc);font-size:1.2rem;color:var(--red);border-top:1px solid var(--ink);padding-top:.25rem;margin-top:.2rem}
.fld.sub>label::before{content:""}
.read .fld.sub>label{display:block}
textarea,select{width:100%;border:0;background:transparent;font:inherit;color:inherit;padding:.1rem 0;resize:none;overflow:hidden;display:block;border-radius:0}
textarea::placeholder{color:var(--muted);opacity:.65}
.edit textarea{border-bottom:1px dashed var(--faint)}
.edit textarea:hover{background:rgba(255,255,255,.16)}
textarea:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.edit .fld.sub textarea:focus-visible{outline-offset:2px}
.read .fld.empty{display:none}
.print{display:none;white-space:pre-wrap;overflow-wrap:anywhere}
.print[data-pre]:not([data-pre=""])::before{content:attr(data-pre)}
.read textarea{display:none}
.read .print{display:block}
.read select{border:0;appearance:none;pointer-events:none}
select{border-bottom:1px dashed var(--faint);font-family:var(--f-sc);font-size:1.2rem;color:var(--red);padding:.2rem 0}
select option{color:#1C1A16;background:#fff}
.t-title{font-family:var(--f-head);font-weight:700;font-size:clamp(2rem,6.4vw,3.2rem);line-height:1.03;letter-spacing:-.01em;text-wrap:balance;text-shadow:0 0 .6px currentColor}
.t-sub{font-style:italic;font-size:1.2rem;line-height:1.35;color:var(--muted)}
.t-body{font-size:1rem;line-height:1.6;hyphens:auto}
.read .print.t-body{text-align:justify}
.t-cap{font-family:var(--f-type);font-size:.8rem;line-height:1.45;color:var(--muted)}
.t-quest{font-family:var(--f-head);font-weight:700;font-style:italic;font-size:clamp(1.45rem,4.6vw,2.05rem);line-height:1.12;color:var(--red)}
.t-name{font-family:var(--f-sc);font-size:1.05rem;letter-spacing:.04em}
@media (min-width:640px){ .print.cols{column-count:2;column-gap:1.7rem;column-rule:1px solid var(--ink)} }
.print.cap::first-letter{float:left;font-family:var(--f-black);font-size:4.1em;line-height:.78;padding:.05em .09em 0 0;color:var(--red)}
.wc{font-family:var(--f-type);font-size:.78rem}
.wc[data-s="low"]{color:var(--warn)} .wc[data-s="ok"]{color:var(--ok)} .wc[data-s="high"]{color:var(--bad)} .wc[data-s="zero"]{color:var(--muted)}
.read .wc{display:none}
.trio{display:grid;gap:.9rem}
.col4{display:grid;gap:.4rem;padding-top:.2rem}
.read .col4.empty{display:none}

/* fotos en blanco y negro, como salen en la prensa */
.img{position:relative;width:100%;aspect-ratio:4/3;border:1px solid var(--ink);padding:.3rem;background:var(--paper)}
.img.tall{aspect-ratio:3/2.3}
.img .in{position:absolute;inset:.3rem;background:var(--faint);display:grid;place-items:center;overflow:hidden}
.img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.12) sepia(.22);mix-blend-mode:multiply}
.img .ph{display:grid;gap:.4rem;justify-items:center;text-align:center;padding:1rem;font-family:var(--f-type);font-size:.85rem;color:var(--muted)}
.img .ph b{font-family:var(--f-sc);font-weight:400;font-size:1.1rem;color:var(--ink)}
.img .ph button{border:1px dashed var(--ink);background:transparent;padding:.35rem .8rem;font-family:var(--f-type);font-size:.82rem;color:var(--ink)}
.img .rm{position:absolute;right:.8rem;bottom:.8rem;background:var(--ink);color:var(--paper);border:0;padding:.2rem .6rem;font-family:var(--f-type);font-size:.75rem}
.read .img.noimg{display:none}
.read .img .rm,.read .img .ph button{display:none}

.guide{margin-top:auto;border:1px dashed var(--ink);padding:.5rem .7rem;font-family:var(--f-type);font-size:.78rem;color:var(--muted)}
.guide summary{cursor:pointer;color:var(--ink)}
.guide ul{margin:.5rem 0 0;padding-left:1.1rem;display:grid;gap:.25rem}
.read .guide{display:none}

/* portada */
.dateline{display:grid;grid-template-columns:auto 1fr auto;gap:.7rem;align-items:center;border-top:3px double var(--ink);border-bottom:1px solid var(--ink);padding:.2rem 0;font-family:var(--f-sc);font-size:.88rem}
.dateline .fld{margin:0}
.dateline textarea,.dateline .print{text-align:center;font-family:var(--f-sc);font-size:.88rem}
.logo{font-family:var(--f-black);font-weight:700;font-size:clamp(3.1rem,15vw,6rem);line-height:.92;text-align:center;margin:.3rem 0 0;text-shadow:0 0 .8px currentColor}
.tag{text-align:center;font-family:var(--f-sc);font-size:.95rem;letter-spacing:.04em;border-bottom:3px double var(--ink);padding-bottom:.45rem}
.cover .t-title{text-align:center;font-size:clamp(1.9rem,7vw,3.3rem)}
.cover .t-sub{text-align:center}
.cover textarea,.cover .print{text-align:inherit}
.cover .body{position:relative}
.stamp{position:absolute;right:.2rem;top:-1.5rem;transform:rotate(-7deg);border:3px solid var(--red);color:var(--red);font-family:var(--f-type);font-size:.95rem;padding:.15rem .6rem;letter-spacing:.08em;text-transform:uppercase;opacity:.85;mix-blend-mode:multiply;pointer-events:none;z-index:2}
.adentro{border:1px solid var(--ink);padding:.5rem .8rem;font-size:.9rem}
.adentro h3{margin:0 0 .25rem;font-family:var(--f-sc);font-weight:400;font-size:1.05rem;color:var(--red)}
.adentro ul{margin:0;padding:0;list-style:none;display:grid;gap:.1rem}
.adentro li{display:flex;gap:.5rem;line-height:1.35}
.adentro li b{font-family:var(--f-type);font-weight:400;font-size:.8rem;min-width:2.4rem;color:var(--muted)}

/* índice */
.toc{margin:0;padding:0;list-style:none}
.toc button{all:unset;box-sizing:border-box;width:100%;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:0 .5rem;padding:.7rem 0;border-bottom:1px solid var(--faint);align-items:baseline}
.toc .tt{font-size:1.2rem;line-height:1.25;font-weight:700}
.toc .tt.pend{font-weight:400;font-style:italic;color:var(--muted)}
.toc .s{grid-column:1;font-family:var(--f-sc);color:var(--red);font-size:.9rem}
.toc .n{grid-column:2;grid-row:1 / span 2;font-family:var(--f-black);font-size:2.2rem;line-height:1;align-self:center}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(1.2rem + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:.6rem 1rem;font-family:var(--f-type);font-size:.85rem;z-index:20;max-width:calc(100% - 2rem)}

@media (max-width:560px){
  .sheet{padding:1.1rem 1.1rem 3.2rem}
  .rh{grid-template-columns:auto 1fr auto}
  .dateline{grid-template-columns:1fr;text-align:center}
  .stamp{top:-2.5rem;font-size:.78rem}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>

  ], guide:[

const $ = s => document.querySelector(s);
function h(tag, props, ...kids){
  const e = document.createElement(tag);
  for (const k in (props||{})) {
    const v = props[k];
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) e.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()) if (c != null) e.append(c.nodeType ? c : document.createTextNode(c));
  return e;
}
function lsGet(k, d){ try { return localStorage.getItem(k) || d; } catch (_) { return d; } }
function lsSet(k, v){ try { localStorage.setItem(k, v); } catch (_) {} }

const S = {}, C = {}, IMGT = {}, Q = {};
let CLAVE = '', canWrite = false, mode = 'read';

/* ---------- estado y guardado ---------- */
function setStatus(s, txt){ const el = $('#status'); el.dataset.s = s; $('#statusTxt').textContent = txt; }
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(()=>{ t.hidden = true; }, 3800); }
function queueSave(key, val){
  S[key] = val;
  if (!canWrite) { setStatus('error', 'Sin clave, esto no se guarda'); return; }
  const s = Q[key] || (Q[key] = {});
  s.val = val; s.dirty = true;
  clearTimeout(s.timer);
  setStatus('saving', 'Guardando');
  s.timer = setTimeout(() => flush(key), 700);
}
async function flush(key){
  const s = Q[key];
  if (s.running) return;
  s.running = true;
  try {
    while (s.dirty) {
      s.dirty = false;
      const r = await fetch('/api/campos', { method: 'POST', headers: { 'content-type': 'application/json', 'x-clave': CLAVE }, body: JSON.stringify({ key, v: s.val }) });
      if (r.status === 401) throw { code: 'auth' };
      if (!r.ok) throw new Error('http ' + r.status);
    }
    if (!Object.values(Q).some(x => x.dirty || x.running && x !== s)) setStatus('ok', 'Todo guardado');
  } catch (e) {
    s.dirty = false;
    if (e && e.code === 'auth') { canWrite = false; CLAVE = ''; try { localStorage.removeItem('clave'); } catch (_) {} applyMode('read'); showNote('La clave no sirve. Pídele la clave correcta a Sebastian.'); showClave(true); }
    setStatus('error', 'No se guardó el último cambio');
  } finally { s.running = false; }
}
function isBusy(key){ const s = Q[key]; return !!(s && (s.dirty || s.running)); }

/* ---------- construcción ---------- */
function fit(el){ if (!el || el.tagName !== 'TEXTAREA') return; el.style.height = 'auto'; el.style.height = el.scrollHeight + 'px'; }
function refitAll(){ for (const k in C) fit(C[k].ta); }
function wordsOf(s){ const m = (s||'').trim().match(/\S+/g); return m ? m.length : 0; }

function buildText(pid, f, key){
  const cls = f.cls || 't-body';
  const ta = h('textarea', { rows: f.rows || 1, placeholder: f.ph || '', 'aria-label': f.label || f.k, id: 'f_' + key, lang: 'es', spellcheck: 'true', class: cls });
  const cols = cls === 't-body' && (f.rows || 1) >= 5;
  const pr = h('div', { class: 'print ' + cls + (cols ? ' cols' : '') + (f.cap ? ' cap' : ''), 'data-pre': f.pre || '' });
  const wrap = h('div', { class: 'fld empty' + (f.sub ? ' sub' : '') });
  if (f.label) wrap.append(h('label', { for: 'f_' + key }, f.label));
  wrap.append(ta, pr);
  let wc = null;
  if (f.words) { wc = h('div', { class: 'wc', 'data-s': 'zero' }); wrap.append(wc); }
  ta.addEventListener('keydown', e => { if (f.t === 'line' && e.key === 'Enter') e.preventDefault(); });
  ta.addEventListener('input', () => {
    if (f.t === 'line') ta.value = ta.value.replace(/\n/g, ' ');
    queueSave(key, ta.value); fit(ta); paint(key); refreshMeta();
  });
  C[key] = { f, pid, ta, pr, wrap, wc };
  return wrap;
}
function buildSelect(pid, f, key){
  const sel = h('select', { id: 'f_' + key, 'aria-label': f.label }, h('option', { value: '' }, 'Elige el género'), f.options.map(o => h('option', { value: o }, o)));
  const wrap = h('div', { class: 'fld empty' }, h('label', { for: 'f_' + key }, f.label), sel);
  sel.addEventListener('change', () => { queueSave(key, sel.value); paint(key); refreshMeta(); });
  C[key] = { f, pid, sel, wrap };
  return wrap;
}
function buildImg(pid, f, key){
  const img = h('img', { alt: f.label, hidden: true });
  const file = h('input', { type: 'file', accept: 'image/*', hidden: true, id: 'file_' + key });
  const pick = h('button', { type: 'button' }, 'subir foto');
  const rm = h('button', { type: 'button', class: 'rm', hidden: true }, 'quitar foto');
  const ph = h('div', { class: 'ph' }, h('b', null, f.label), h('span', null, f.ph || ''), pick);
  const box = h('div', { class: 'img noimg' + (f.tall ? ' tall' : '') }, h('div', { class: 'in' }, img, ph), rm, file);
  const wrap = h('div', { class: 'fld empty' }, box);
  pick.addEventListener('click', () => file.click());
  rm.addEventListener('click', () => { queueSave(key, ''); paint(key); refreshMeta(); });
  file.addEventListener('change', async () => {
    const fl = file.files && file.files[0]; file.value = '';
    if (!fl) return;
    try { const url = await toDataUrl(fl, f.tall ? 1000 : 1100); queueSave(key, url); paint(key); refreshMeta(); }
    catch (e) { toast('No pude leer esa foto. Prueba con un JPG o un PNG.'); }
  });
  C[key] = { f, pid, img, ph, rm, box, wrap };
  return wrap;
}
async function toDataUrl(file, max){
  const bmp = await createImageBitmap(file);
  for (const m of [max, 760, 560, 420]) {
    const sc = Math.min(1, m / Math.max(bmp.width, bmp.height));
    const cv = document.createElement('canvas');
    cv.width = Math.round(bmp.width * sc); cv.height = Math.round(bmp.height * sc);
    cv.getContext('2d').drawImage(bmp, 0, 0, cv.width, cv.height);
    for (const q of [0.74, 0.6, 0.48]) {
      const u = cv.toDataURL('image/jpeg', q);
      if (u.length < 200000) return u;
    }
  }
  throw new Error('grande');
}
function buildColumn(pid, f){
  const ka = pid + '__' + f.k + '_autor', kt = pid + '__' + f.k + '_texto';
  const a = buildText(pid, { k: f.k + '_autor', t: 'line', label: 'Columna de opinión ' + f.n, ph: 'Nombre del integrante', cls: 't-name', pre: 'Por ', sub: true }, ka);
  const t = buildText(pid, { k: f.k + '_texto', t: 'text', label: 'Texto de la columna', ph: 'Tesis, dos argumentos, una objeción con su respuesta y una conclusión.', cls: 't-body', rows: 8, words: [300, 400] }, kt);
  const box = h('div', { class: 'col4 empty' }, a, t);
  C[ka].group = box; C[kt].group = box;
  return box;
}

function buildSheet(p){
  const sheet = h('section', { class: 'sheet' + (p.cover ? ' cover' : ''), id: 'pag' + p.n, 'aria-label': 'Página ' + p.n + ', ' + p.sec });
  const body = h('div', { class: 'body' });
  let dateMid = null;
  if (p.cover) {
    dateMid = h('div');
    sheet.append(h('div', { class: 'dateline' }, h('span', null, 'Año I'), dateMid, h('span', null, 'Precio: una buena idea')));
    sheet.append(h('h1', { class: 'logo' }, 'Voces de Tocopilla'));
    sheet.append(h('div', { class: 'tag' }, 'Órgano de los estudiantes de cuarto medio del Liceo Politécnico Diego Portales'));
  } else {
    sheet.append(h('div', { class: 'rh' }, h('span', { class: 'brand' }, 'Voces de Tocopilla'), h('span', { class: 'sec' }, p.sec), h('span', { class: 'pg' }, 'pág. ' + p.n)));
  }
  if (p.cover) body.append(h('div', { class: 'stamp' }, 'Primera edición'));
  if (p.kick) body.append(h('div', { class: 'kick' }, p.kick));
  if (p.index) {
    body.append(h('h2', { class: 't-title' }, 'En este número'));
    body.append(h('ol', { class: 'toc', id: 'toc' }));
  }
  for (const f of p.fields) {
    let el;
    if (f.t === 'group') { el = h('div', { class: 'trio' }); for (const s of f.fields) el.append(buildText(p.id, s, p.id + '__' + s.k)); }
    else if (f.t === 'column') el = buildColumn(p.id, f);
    else if (f.t === 'select') el = buildSelect(p.id, f, p.id + '__' + f.k);
    else if (f.t === 'img') el = buildImg(p.id, f, p.id + '__' + f.k);
    else el = buildText(p.id, f, p.id + '__' + f.k);
    if (dateMid && f.k === 'numero') dateMid.append(el); else body.append(el);
  }
  if (p.cover) body.append(h('div', { class: 'adentro' }, h('h3', null, 'Adentro'), h('ul', { id: 'adentro' })));
  if (p.guide) body.append(h('details', { class: 'guide' }, h('summary', null, 'Qué pide el profe en esta página'), h('ul', null, p.guide.map(g => h('li', null, g)))));
  sheet.append(body);
  if (!p.cover) sheet.append(h('div', { class: 'folio' }, '— ' + p.n + ' —'));
  return sheet;
}

/* ---------- pintar valores ---------- */
function paint(key){
  const c = C[key]; if (!c) return;
  const v = S[key] || '';
  const has = v.trim().length > 0;
  if (c.ta) {
    if (c.ta.value !== v) c.ta.value = v;
    c.pr.textContent = v;
    fit(c.ta);
    c.wrap.classList.toggle('empty', !has);
    if (c.wc) {
      const n = wordsOf(v), [lo, hi] = c.f.words;
      let s = 'ok', t;
      if (n === 0) { s = 'zero'; t = 'Pide entre ' + lo + ' y ' + hi + ' palabras'; }
      else if (n < lo) { s = 'low'; t = 'Van ' + n + ' palabras, faltan ' + (lo - n) + ' pa llegar a ' + lo; }
      else if (n > hi) { s = 'high'; t = 'Van ' + n + ' palabras, te pasaste por ' + (n - hi); }
      else t = 'Van ' + n + ' palabras, vas dentro del rango';
      c.wc.dataset.s = s; c.wc.textContent = t;
    }
    if (c.group) {
      const base = c.pid + '__' + c.f.k.replace(/_(autor|texto)$/, '');
      c.group.classList.toggle('empty', !(S[base + '_autor'] || '').trim() && !(S[base + '_texto'] || '').trim());
    }
  } else if (c.sel) {
    if (c.sel.value !== v) c.sel.value = v;
    c.wrap.classList.toggle('empty', !has);
  } else if (c.img) {
    c.img.hidden = !has; if (has) c.img.src = v; else c.img.removeAttribute('src');
    c.ph.hidden = has; c.rm.hidden = !has || mode === 'read';
    c.box.classList.toggle('noimg', !has);
    c.wrap.classList.toggle('empty', !has);
  }
}
function pageHas(p){
  const keys = [];
  for (const f of p.fields) {
    if (f.t === 'group') f.fields.forEach(s => keys.push(p.id + '__' + s.k));
    else if (f.t === 'column') keys.push(p.id + '__' + f.k + '_autor', p.id + '__' + f.k + '_texto');
    else keys.push(p.id + '__' + f.k);
  }
  return keys.some(k => (S[k] || '').trim());
}
function refreshMeta(){
  let done = 0;
  for (const p of PAGES) {
    if (p.index) continue;
    const has = pageHas(p);
    if (has) done++;
    const chip = $('#chip' + p.n); if (chip) chip.classList.toggle('has', has);
  }
  $('#prog').textContent = done + ' de 9 páginas con texto';
  const toc = $('#toc'), ad = $('#adentro');
  if (toc) toc.replaceChildren();
  if (ad) ad.replaceChildren();
  for (const p of PAGES.filter(x => x.n >= 3)) {
    const title = (S[p.id + '__' + p.tk] || '').trim();
    if (toc) toc.append(h('li', null, h('button', { type: 'button', onclick: () => goTo(p.n) },
      h('span', { class: 'tt' + (title ? '' : ' pend') }, title || 'Por escribir'), h('span', { class: 's' }, p.sec), h('span', { class: 'n' }, String(p.n)))));
    if (ad && title) ad.append(h('li', null, h('b', null, 'pág. ' + p.n), h('span', null, title)));
  }
  if (ad && !ad.children.length) ad.append(h('li', null, h('span', { style: 'font-style:italic;color:var(--muted)' }, 'Los titulares aparecen acá a medida que se escriben.')));
}
function goTo(n){ const el = $('#pag' + n); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }

function showNote(t){ const n = $('#note'); n.textContent = t; n.hidden = !t; }
function applyMode(m){
  mode = m;
  document.body.classList.toggle('edit', m === 'edit');
  document.body.classList.toggle('read', m === 'read');
  $('#mEdit').setAttribute('aria-pressed', m === 'edit'); $('#mRead').setAttribute('aria-pressed', m === 'read');
  for (const k in C) {
    const c = C[k];
    if (c.ta) c.ta.readOnly = (m === 'read') || !canWrite;
    if (c.sel) c.sel.disabled = (m === 'read') || !canWrite;
    if (c.img) { c.rm.hidden = !(S[k] || '').trim() || m === 'read' || !canWrite; c.ph.querySelector('button').hidden = !canWrite; }
  }
  requestAnimationFrame(refitAll);
}

/* ---------- tamaño de letra y papel ---------- */
const PALS = [['diario', 'Papel de diario'], ['blanco', 'Blanco imprenta'], ['noche', 'Papel de noche']];
let pal = lsGet('pal', 'diario'), kk = parseFloat(lsGet('k', '1'));
if (!PALS.some(x => x[0] === pal)) pal = 'diario';
if (!(kk >= 0.85 && kk <= 1.35)) kk = 1;
function applyLook(){
  document.documentElement.dataset.pal = pal;
  document.documentElement.style.setProperty('--k', String(kk));
  $('#palBtn').textContent = PALS.find(x => x[0] === pal)[1];
  $('#aMenos').disabled = kk <= 0.851; $('#aMas').disabled = kk >= 1.349;
  requestAnimationFrame(() => { refitAll(); requestAnimationFrame(refitAll); });
}
$('#aMenos').addEventListener('click', () => { kk = Math.max(0.85, Math.round((kk - 0.1) * 100) / 100); lsSet('k', kk); applyLook(); });
$('#aMas').addEventListener('click', () => { kk = Math.min(1.35, Math.round((kk + 0.1) * 100) / 100); lsSet('k', kk); applyLook(); });
$('#palBtn').addEventListener('click', () => { const i = PALS.findIndex(x => x[0] === pal); pal = PALS[(i + 1) % PALS.length][0]; lsSet('pal', pal); applyLook(); });

/* ---------- descarga de texto ---------- */
function buildTxt(){
  const out = ['VOCES DE TOCOPILLA', 'Liceo Politécnico Diego Portales, cuartos medios', ''];
  for (const p of PAGES) {
    out.push('=== PÁGINA ' + p.n + ' · ' + p.sec.toUpperCase() + ' ===');
    for (const k in C) {
      const c = C[k]; if (c.pid !== p.id || c.img) continue;
      const v = (S[k] || '').trim(); if (!v) continue;
      out.push((c.f.label ? c.f.label + ':\n' : '') + v, '');
    }
    out.push('');
  }
  return out.join('\n');
}

/* ---------- arranque ---------- */
const pagesEl = $('#pages'), chipsEl = $('#chips');
for (const p of PAGES) {
  pagesEl.append(buildSheet(p));
  chipsEl.append(h('button', { type: 'button', class: 'chip', id: 'chip' + p.n, 'aria-label': 'Ir a la página ' + p.n, onclick: () => goTo(p.n) }, String(p.n)));
}
function showClave(on){ $('#claveForm').hidden = !on; if (on) $('#clave').focus(); }
$('#mEdit').addEventListener('click', () => { if (!canWrite) { showClave(true); showNote('Para escribir pon la clave del equipo arriba.'); return; } applyMode('edit'); });
$('#mRead').addEventListener('click', () => applyMode('read'));
applyLook();
applyMode('read');
refreshMeta();
setStatus('saving', 'Conectando');
let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(refitAll, 150); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(refitAll);

async function checkClave(c){
  try { const r = await fetch('/api/campos', { method: 'POST', headers: { 'content-type': 'application/json', 'x-clave': c }, body: JSON.stringify({ check: true }) }); return r.ok; }
  catch (e) { return false; }
}
async function pull(){
  try {
    const r = await fetch('/api/campos', { cache: 'no-store' });
    if (!r.ok) throw new Error('http');
    const data = await r.json();
    for (const key in (data.campos || {})) {
      const v = data.campos[key];
      const c = C[key];
      if (typeof v !== 'string' || !c) continue;
      if (isBusy(key) || (c.ta && document.activeElement === c.ta)) continue;
      if (S[key] !== v) { S[key] = v; paint(key); }
    }
    for (const key in (data.imgs || {})) {
      if (!C[key] || isBusy(key) || IMGT[key] === data.imgs[key]) continue;
      const ri = await fetch('/api/campos?img=' + encodeURIComponent(key), { cache: 'no-store' });
      if (!ri.ok) continue;
      const j = await ri.json();
      IMGT[key] = data.imgs[key]; S[key] = j.v || ''; paint(key);
    }
    refreshMeta();
    if (!Object.values(Q).some(x => x.dirty || x.running)) setStatus('ok', canWrite ? 'Todo guardado' : 'Solo lectura');
  } catch (e) { setStatus('error', 'Sin conexión, reintentando'); }
}
$('#dl').addEventListener('click', () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([buildTxt()], { type: 'text/plain;charset=utf-8' }));
  a.download = 'Voces-de-Tocopilla.txt'; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
});
$('#claveForm').addEventListener('submit', async e => {
  e.preventDefault();
  const c = $('#clave').value.trim(); if (!c) return;
  if (await checkClave(c)) {
    CLAVE = c; canWrite = true; lsSet('clave', c);
    showClave(false); showNote(''); applyMode('edit'); setStatus('ok', 'Todo guardado'); toast('Listo, ya puedes escribir.');
  } else { toast('Esa clave no es. Revísala con Sebastian.'); }
});
(async function start(){
  await pull();
  const saved = lsGet('clave', '');
  if (saved && await checkClave(saved)) { CLAVE = saved; canWrite = true; applyMode('edit'); setStatus('ok', 'Todo guardado'); }
  else { showClave(true); showNote('Estás en modo lectura. Pon la clave del equipo pa poder escribir.'); }
  setInterval(() => { if (!document.hidden) pull(); }, 4000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) pull(); });
})();
